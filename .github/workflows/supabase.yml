name: Deploy Supabase adviser
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: supabase-adviser
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Validate deployment settings
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo 'Add the SUPABASE_ACCESS_TOKEN repository secret.'; exit 1; }
          test -n "$SUPABASE_PROJECT_REF" || { echo 'Add the SUPABASE_PROJECT_REF repository variable.'; exit 1; }
      - name: Deploy authenticated adviser
        run: supabase functions deploy adviser --project-ref "$SUPABASE_PROJECT_REF"
